name: Gin
options:
  bundleIdPrefix: com.odthientho
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  xcodeVersion: "16.0"
  swift: "6.0"

configs:
  Debug: debug
  Release: release

# Signing lives in Signing.xcconfig, which is deliberately NOT tracked: an Apple
# Development Team ID identifies its owner, and this repo is public. `setup.sh`
# creates the file from Signing.xcconfig.example on first run.
#
# It is a config file rather than a value here because regenerating the project
# wipes anything set only in Xcode's UI, so signing has to survive `xcodegen`.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: 6.0
    ENABLE_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic

targets:
  Gin:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Gin
        excludes:
          - "**/*.md"
    resources:
      - path: Gin/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.odthientho.Gin
        INFOPLIST_FILE: Gin/Info.plist
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # iPad only. A phone-sized layout would break every touch-target rule.
        TARGETED_DEVICE_FAMILY: "2"
    info:
      path: Gin/Info.plist
      properties:
        CFBundleName: Gin
        CFBundleDisplayName: Gin
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Landscape only, both ways round — a propped-up iPad gets flipped
        # constantly and the child should never trigger a rotation animation.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # No Slide Over or Split View. A toddler drags from the screen edge
        # by accident constantly; multitasking would eject them mid-activity.
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false

  GinTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GinTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Gin

schemes:
  Gin:
    build:
      targets:
        Gin: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GinTests
